include:
  - project: 'pedroetb-projects/gitlab-ci-templates'
    ref: main
    file: '/build/docker/_docker.yml'
  - project: 'pedroetb-projects/gitlab-ci-templates'
    ref: main
    file: '/build/docker/dockerfile-linting.yml'
  - project: 'pedroetb-projects/gitlab-ci-templates'
    ref: main
    file: '/test/container-scanning.yml'
  - project: 'pedroetb-projects/gitlab-ci-templates'
    ref: main
    file: '/test/auto.yml'

.docker-login-gitlab: &docker-login-gitlab |
  env | grep "^CI_JOB_TOKEN=" | cut -d '=' -f 2- | docker login -u gitlab-ci-token --password-stdin ${CI_REGISTRY}

.docker-login-dockerhub: &docker-login-dockerhub |
  env | grep "^DOCKER_HUB_PASS=" | cut -d '=' -f 2- | docker login -u ${DOCKER_HUB_USER} --password-stdin

.create-multiarch-builder: &create-multiarch-builder >
  docker context create builder-context
  --docker "host=tcp://docker:2376,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
  > /dev/null 2>&1;
  docker buildx create --driver docker-container --name multiarch-builder --use builder-context > /dev/null

.docker-pull-latest: &docker-pull-latest >
  dockerPullLatestExitCode=0;
  docker pull -q
  ${PACKAGED_IMAGE_NAME}:${LATEST_TAG_VALUE} > /dev/null 2>&1 || dockerPullLatestExitCode=${?};
  if [ ${dockerPullLatestExitCode} -eq 0 ];
  then
  echo "Image '${PACKAGED_IMAGE_NAME}:${LATEST_TAG_VALUE}' found and pulled, using it for layers cache ..";
  fi

.docker-compose-build: &docker-compose-build >
  COMPOSE_FILE=${COMPOSE_PROJECT_DIRECTORY}/${COMPOSE_FILE_NAME}
  IMAGE_NAME=${PACKAGED_IMAGE_NAME}
  IMAGE_TAG=${PACKAGED_IMAGE_TAG}
  docker compose
  --env-file ${COMPOSE_PROJECT_DIRECTORY}/${COMPOSE_ENV_FILE_NAME}
  build
  -q
  --pull
  --push
  ${DOCKER_BUILD_ARGS}

.docker-build:
  extends: .dind-env
  image: ${PACKAGING_IMAGE_NAME}:${PACKAGING_IMAGE_TAG}
  variables:
    PACKAGING_IMAGE_NAME: docker
    PACKAGING_IMAGE_TAG: latest
    PACKAGED_IMAGE_NAME: ${CI_REGISTRY_IMAGE}
    IMAGETOOLS_CREATE_PROGRESS: none
    COMPOSE_FILE_NAME: compose.yaml
    COMPOSE_ENV_FILE_NAME: .env
    COMPOSE_PROJECT_DIRECTORY: '.'
    BUILDX_GIT_INFO: 'false'

📦 docker-build:
  extends:
    - .docker-build
    - .docker-branch-rules
  variables:
    PACKAGED_IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
    LATEST_TAG_VALUE: ${CI_COMMIT_REF_SLUG}
    VERSION: ${CI_COMMIT_SHORT_SHA}
  script:
    - *docker-login-gitlab
    - *create-multiarch-builder
    - *docker-pull-latest
    - *docker-compose-build
    - >
      docker buildx imagetools create
      --tag ${PACKAGED_IMAGE_NAME}:${LATEST_TAG_VALUE}
      --progress ${IMAGETOOLS_CREATE_PROGRESS}
      ${PACKAGED_IMAGE_NAME}:${PACKAGED_IMAGE_TAG}

🎁 docker-build:
  extends:
    - .docker-build
    - .docker-tag-rules
  variables:
    PACKAGED_IMAGE_TAG: ${CI_COMMIT_TAG}
    LATEST_TAG_VALUE: latest
    VERSION: ${CI_COMMIT_TAG}
  script:
    - *docker-login-gitlab
    - *create-multiarch-builder
    - *docker-pull-latest
    - *docker-compose-build
    - *docker-login-dockerhub
    - >
      dockerHubImagePath="$(echo ${CI_PROJECT_PATH} | cut -d '/' -f 2- | sed 's/\//-/g')";
      dockerHubImage="${DOCKER_HUB_ROOT}/${dockerHubImagePath}";
      docker buildx imagetools create
      --tag ${PACKAGED_IMAGE_NAME}:${LATEST_TAG_VALUE}
      --tag ${dockerHubImage}:${CI_COMMIT_TAG}
      --tag ${dockerHubImage}:${LATEST_TAG_VALUE}
      --progress ${IMAGETOOLS_CREATE_PROGRESS}
      ${PACKAGED_IMAGE_NAME}:${PACKAGED_IMAGE_TAG}
